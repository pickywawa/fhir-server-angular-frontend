services:
  postgres:
    image: postgres:15-alpine
    container_name: healthapp-postgres
    environment:
      POSTGRES_DB: healthapp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - healthapp-network

  postgres-events:
    image: postgres:15-alpine
    container_name: healthapp-postgres-events
    environment:
      POSTGRES_DB: healthapp_events_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-events-data:/var/lib/postgresql/data
    networks:
      - healthapp-network

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    container_name: healthapp-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - "9092:9092"
    networks:
      - healthapp-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: healthapp-keycloak
    command: start-dev --import-realm --import-strategy=OVERWRITE_EXISTING
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/fhir-realm.json:/opt/keycloak/data/import/fhir-realm.json
      - ./keycloak/master-realm.json:/opt/keycloak/data/import/master-realm.json
      - ./keycloak/themes:/opt/keycloak/themes
    networks:
      - healthapp-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8180/health/ready || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  jitsi-web:
    image: jitsi/web:stable
    container_name: healthapp-jitsi-web
    restart: unless-stopped
    ports:
      - "8443:443"
      - "8082:80"
    environment:
      - PUBLIC_URL=https://localhost:8443
      - ENABLE_AUTH=0
      - ENABLE_GUESTS=1
      - ENABLE_LOBBY=0
      - ENABLE_XMPP_WEBSOCKET=1
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_BOSH_URL_BASE=http://xmpp.meet.jitsi:5280
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - JVB_TCP_HARVESTER_DISABLED=true
      - JICOFO_AUTH_USER=focus
    depends_on:
      - jitsi-prosody
    networks:
      - healthapp-network
      - meet.jitsi

  jitsi-prosody:
    image: jitsi/prosody:stable
    container_name: healthapp-jitsi-prosody
    restart: unless-stopped
    expose:
      - "5222"
      - "5347"
      - "5280"
    environment:
      - AUTH_TYPE=internal
      - ENABLE_AUTH=0
      - ENABLE_GUESTS=1
      - ENABLE_LOBBY=0
      - GLOBAL_MODULES=
      - GLOBAL_CONFIG=
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_GUEST_DOMAIN=guest.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - JICOFO_COMPONENT_SECRET=healthapp_jicofo_secret_2024
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=healthapp_jicofo_pwd_2024
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=healthapp_jvb_pwd_2024
      - JIBRI_XMPP_USER=jibri
      - JIBRI_RECORDER_USER=recorder
      - TZ=Europe/Paris
    networks:
      meet.jitsi:
        aliases:
          - xmpp.meet.jitsi

  jitsi-jicofo:
    image: jitsi/jicofo:stable
    container_name: healthapp-jitsi-jicofo
    restart: unless-stopped
    environment:
      - AUTH_TYPE=internal
      - ENABLE_AUTH=0
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_SERVER=xmpp.meet.jitsi
      - JICOFO_COMPONENT_SECRET=healthapp_jicofo_secret_2024
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=healthapp_jicofo_pwd_2024
      - JVB_BREWERY_MUC=jvbbrewery
      - TZ=Europe/Paris
    depends_on:
      - jitsi-prosody
    networks:
      - meet.jitsi

  jitsi-jvb:
    image: jitsi/jvb:stable
    container_name: healthapp-jitsi-jvb
    restart: unless-stopped
    ports:
      - "10000:10000/udp"
    environment:
      - DOCKER_HOST_ADDRESS=127.0.0.1
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_SERVER=xmpp.meet.jitsi
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=healthapp_jvb_pwd_2024
      - JVB_BREWERY_MUC=jvbbrewery
      - JVB_PORT=10000
      - TZ=Europe/Paris
    depends_on:
      - jitsi-prosody
    networks:
      - meet.jitsi

volumes:
  postgres-data:
  postgres-events-data:

networks:
  healthapp-network:
    driver: bridge
  meet.jitsi:

