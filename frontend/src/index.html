<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Doctocare</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Application de gestion de santé et de patients en ligne">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  
  <!-- iOS App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Doctocare">
  <meta name="apple-mobile-web-app-status-bar" content="default">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
  
  <!-- Theme Color -->
  <meta name="theme-color" content="#ffffff">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/doctocare-icon.png">
</head>
<body>
  <app-root></app-root>
  
  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('[PWA] Service Worker registered:', registration);
          })
          .catch((error) => {
            console.error('[PWA] Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
