<section class="external-page">
  @if (loading) {
    <div class="status loading">{{ 'visio.window.loading' | translate }}</div>
  }

  @if (error) {
    <div class="status error">
      <div>{{ error | translate }}</div>
      @if (error === 'visio.error.sdkLoad') {
        <div class="cert-actions">
          <a [href]="jitsiBaseUrl" target="_blank" rel="noopener" class="cert-link">
            {{ 'visio.error.certHint' | translate }}
          </a>
          <button type="button" class="cert-btn" (click)="openJitsiCertPage()">
            {{ 'visio.error.certOpenPopup' | translate }}
          </button>
        </div>
      }
    </div>
  }

  <div class="jitsi-host" #jitsiContainer></div>
</section>
