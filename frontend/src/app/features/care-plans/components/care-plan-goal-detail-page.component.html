<app-module-shell [breadcrumbs]="breadcrumbs">
  <app-bubble-card [title]="isCreate ? ('carePlans.detail.newObjective' | translate) : ('carePlans.detail.objective' | translate)">
    @if (!isCreate) {
      <div bubbleActions>
        @if (!editMode) {
          <button type="button" class="btn btn-primary" (click)="enableEdit()">{{ 'common.edit' | translate }}</button>
        }
      </div>
    }

    @if (loading) {
      <div class="state">{{ 'common.loading' | translate }}</div>
    }

    @if (!loading && error) {
      <div class="state error">{{ error }}</div>
    }

    @if (!loading) {
      <form [formGroup]="form" (ngSubmit)="submit()" class="form-layout">
        <app-form-control-field
          [label]="('carePlans.fields.title' | translate) + ' *'"
          forId="caregoal-title"
          [uiDisabled]="!(editMode || isCreate)"
          formControlName="title"></app-form-control-field>

        <app-form-control-field
          [label]="'carePlans.fields.description' | translate"
          forId="caregoal-description"
          kind="textarea"
          [rows]="4"
          [uiDisabled]="!(editMode || isCreate)"
          formControlName="description"></app-form-control-field>

        <div class="grid three">
          <app-form-control-field
            [label]="'carePlans.fields.lifecycleStatus' | translate"
            forId="caregoal-lifecycle"
            kind="select"
            [options]="lifecycleOptions"
            [uiDisabled]="!(editMode || isCreate)"
            formControlName="lifecycleStatus"></app-form-control-field>

          <app-form-control-field
            [label]="'carePlans.fields.achievementStatus' | translate"
            forId="caregoal-achievement"
            kind="select"
            [options]="achievementOptions"
            [uiDisabled]="!(editMode || isCreate)"
            formControlName="achievementStatus"></app-form-control-field>

          <app-form-control-field
            [label]="'carePlans.fields.priority' | translate"
            forId="caregoal-priority"
            kind="select"
            [options]="priorityOptions"
            [uiDisabled]="!(editMode || isCreate)"
            formControlName="priority"></app-form-control-field>
        </div>

        <app-form-control-field
          [label]="'carePlans.fields.dueDate' | translate"
          forId="caregoal-due-date"
          type="date"
          [uiDisabled]="!(editMode || isCreate)"
          formControlName="dueDate"></app-form-control-field>

        @if (editMode || isCreate) {
          <div class="actions">
            <button type="button" class="btn btn-neutral" (click)="cancelEdit()">{{ 'common.cancel' | translate }}</button>
            <button type="submit" class="btn btn-primary" [disabled]="saving || form.invalid">
              {{ saving ? ('common.saving' | translate) : ('common.save' | translate) }}
            </button>
          </div>
        }
      </form>
    }
  </app-bubble-card>
</app-module-shell>
